<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hop! — tez va mazali burgerlar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>:root{--sun:#ffd23f;--tomato:#f0432c;--ink:#1d1f4a;--pickle:#2fa56a;--white:#fff;color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--sun);color:var(--ink);font:700 17px/1.5 'Nunito',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.logo,.btn{font-family:'Lilita One','Nunito',sans-serif;font-weight:400}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--tomato);border-bottom:4px solid var(--ink)}
.logo{font-size:28px;color:var(--white);text-decoration:none;letter-spacing:.01em}
.logo span{color:var(--sun);margin-left:4px}
.cart-btn{background:var(--white);border:3px solid var(--ink);border-radius:99px;padding:6px 16px;box-shadow:3px 3px 0 var(--ink);font-weight:800}
.cart-btn b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--white);margin-left:6px;font-size:14px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:20px;padding:44px 0 36px}
.hero h1{font-size:clamp(38px,7vw,72px);line-height:1.02;margin:0 0 16px}
.hero p{max-width:40ch;margin:0 0 24px}
.hero-art{width:100%;max-width:340px;justify-self:center;transform:rotate(-8deg)}
.btn{display:inline-block;background:var(--tomato);color:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px 24px;font-size:19px;box-shadow:4px 4px 0 var(--ink);text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.small{padding:7px 14px;font-size:16px;box-shadow:3px 3px 0 var(--ink)}
.btn.wide{width:100%;text-align:center}
.sec{font-size:40px;margin:12px 0 14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{background:var(--white);border:3px solid var(--ink);border-radius:99px;padding:7px 18px;font-weight:800}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.item{background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:20px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column}
.pic{display:grid;place-items:center;height:150px;border:3px solid var(--ink);border-radius:14px;margin-bottom:12px;background:#ffd9a8}
.pic img{height:128px;width:auto;max-width:100%}
.pic[data-cat=Burgerlar]{background:#ffb8a8}.pic[data-cat=Gazaklar]{background:#c9f0d8}.pic[data-cat=Ichimliklar]{background:#bfe3ff}.pic[data-cat=Shirinliklar]{background:#ffc9e6}
.item h3{font-size:24px;margin:0 0 4px}
.item p{margin:0 0 16px;font-weight:500;color:#4a4d7a;flex:1}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:56px;padding:24px;background:var(--ink);color:var(--white);border-radius:20px}
.overlay{position:fixed;inset:0;background:rgba(29,31,74,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--white);border-left:4px solid var(--ink);z-index:11;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.drawer-head h2{margin:0;font-size:32px}
.x{background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:4px 14px}
.empty{color:#4a4d7a;font-weight:500}
.lines{list-style:none;margin:0;padding:0;flex:1}
.lines li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed #ccd}

.nm{flex:1;display:flex;flex-direction:column}
.nm small{font-weight:500;color:#4a4d7a}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:20px;line-height:1;padding:0}
.qty span{min-width:20px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:16px 0}
.order{display:flex;flex-direction:column;gap:14px}
.order label{display:flex;flex-direction:column;gap:6px;font-weight:800}
.order input,.order textarea{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:600 17px 'Nunito',sans-serif;resize:vertical}
.link{background:none;border:0;text-decoration:underline;padding:6px;align-self:center}
.done{text-align:center;padding:30px 6px}
.done .big{width:140px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:3px solid var(--ink);border-radius:12px;background:var(--white);padding:9px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
.done h3{font-size:30px;margin:8px 0}
.done p{font-weight:500}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:28px}.hero-art{order:-1;max-width:200px;justify-self:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.lines .ic{width:56px;height:40px;object-fit:contain;background:var(--sun);border:2px solid var(--ink);border-radius:10px}

function OrderForm({ total, onBack, onDone }) {
  const [type, setType] = useState('dine') // dine = restoranda, delivery = yetkazib berish
  const [f, setF] = useState({ name: '', phone: '', table: '', address: '' })
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value })

  const submit = (e) => {
    e.preventDefault()
    // Bu yerga o‘z API so‘rovingizni qo‘shing: fetch('/api/orders', { method: 'POST', body: JSON.stringify({ type, ...f }) })
    onDone(type)
  }

  return (
    <form className="order" onSubmit={submit}>
      <div className="seg" role="group" aria-label="Buyurtma turi">
        <button type="button" aria-pressed={type === 'dine'} onClick={() => setType('dine')}>Restoranda</button>
        <button type="button" aria-pressed={type === 'delivery'} onClick={() => setType('delivery')}>Yetkazib berish</button>
      </div>

      <label>Ismingiz
        <input required value={f.name} onChange={set('name')} autoComplete="name" />
      </label>

      {type === 'dine' ? (
        <label>Stol raqami
          <input required inputMode="numeric" pattern="[0-9]{1,3}" placeholder="Masalan: 7"
            value={f.table} onChange={set('table')} />
        </label>
      ) : (
        <>
          <label>Telefon raqam
            <input required type="tel" pattern="[0-9+ ()-]{9,}" placeholder="+998 90 123 45 67"
              value={f.phone} onChange={set('phone')} autoComplete="tel" />
          </label>
          <label>Yetkazish manzili
            <textarea required rows="3" value={f.address} onChange={set('address')} />
          </label>
        </>
      )}

      <div className="total"><span>To‘lov</span><strong>{som(total)}</strong></div>
      <button className="btn wide">Buyurtma berish</button>
      <button type="button" className="link" onClick={onBack}>Savatga qaytish</button>
    </form>
  )
}


function Cart({ open, items, onClose, onChangeQty, onClear }) {
  const [step, setStep] = useState('cart') // cart | form | done
  const [kind, setKind] = useState('dine')
  const total = items.reduce((s, i) => s + i.price * i.qty, 0)

  const close = () => { onClose(); if (step === 'done') setStep('cart') }
  const placed = (type) => { setKind(type); onClear(); setStep('done') }

  return (
    <>
      <div className={'overlay' + (open ? ' show' : '')} onClick={close} />
      <aside className={'drawer' + (open ? ' open' : '')} aria-hidden={!open} aria-label="Savat">
        <div className="drawer-head">

          </div>
        ) : items.length === 0 ? (

        ) : step === 'cart' ? (
          <>
            <ul className="lines">
              {items.map((i) => (
                <li key={i.id}>

function App() {
  const [cat, setCat] = useState('Hammasi')
  const [cart, setCart] = useState({}) // { id: qty }
  const [open, setOpen] = useState(false)

  const add = (item) => { setCart((c) => ({ ...c, [item.id]: (c[item.id] || 0) + 1 })) }
  const change = (id, d) => setCart((c) => {
    const q = (c[id] || 0) + d
    const n = { ...c }
    if (q <= 0) delete n[id]; else n[id] = q
    return n
  })

  const items = useMemo(() => menu.filter((m) => cart[m.id]).map((m) => ({ ...m, qty: cart[m.id] })), [cart])
  const count = items.reduce((s, i) => s + i.qty, 0)
  const list = menu.filter((m) => cat === 'Hammasi' || m.cat === cat)

  return (
    <>
      <Header count={count} onCart={() => setOpen(true)} />
      <main className="wrap">
        <Hero />
        <section id="menyu">
          <h2 className="sec">Menyu</h2>
          <CategoryTabs categories={categories} current={cat} onChange={setCat} />
          <div className="grid">
            {list.map((m) => <MenuItem key={m.id} item={m} qty={cart[m.id]} onAdd={add} />)}
          </div>
        </section>
        <footer className="foot">
          <div><b>Hop! — manzil</b><br />Toshkent, Amir Temur ko‘chasi 12</div>
          <div><b>Ish vaqti</b><br />Har kuni 10:00 — 02:00</div>
          <div><b>Telefon</b><br />+998 90 000 00 00</div>
        </footer>
      </main>
      <Cart open={open} items={items} onClose={() => setOpen(false)} onChangeQty={change} onClear={() => setCart({})} />
    </>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script></body></html>
